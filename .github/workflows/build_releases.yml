name: Build APK and Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  # === JOB 1: Construiește versiunea de Android ===
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scorekeeper-BioBuzz-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  # === JOB 2: Construiește versiunea de Windows ===
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Prepare Installer Folder
        shell: powershell
        run: New-Item -Path "build\windows\installer" -ItemType Directory -Force

      - name: Build Inno Setup Installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_script.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scorekeeper-BioBuzz-Windows
          path: build\windows\installer\Scorekeeper_BioBuzz_Setup_v1.0.0.exe